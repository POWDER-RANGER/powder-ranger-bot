<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="1100" height="360" role="img" aria-label="PR-REX · with the Legend">
<title>PR-REX · with the Legend</title>
<rect width="1100" height="360" fill="#0b0c0d"/>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#d9d6cc">
<rect x="40" y="34" width="8" height="8" fill="#f2c230"/>
<text x="56" y="43" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#8f908a">PR-REX · WITH THE LEGEND</text>
<text x="40" y="78" font-size="26" font-weight="700">The Legend always wins</text>
<rect x="40" y="110" width="240" height="96" fill="#121416" stroke="#f2c230"/><text x="52" y="136" font-size="15" font-weight="700" letter-spacing="1.5">LEGEND</text><text x="52" y="156" font-size="12" fill="#8f908a">Pad, keys / switch, voice, gaze</text><text x="52" y="194" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#7fb48a">BUILT, TESTED</text><rect x="40" y="226" width="240" height="80" fill="#121416" stroke="#2a2d31"/><text x="52" y="252" font-size="15" font-weight="700" letter-spacing="1.5">PR-REX</text><text x="52" y="272" font-size="12" fill="#8f908a">Reflex or planner intent</text><text x="52" y="294" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#8f908a">PROPOSES ONLY</text><path d="M282 158H374" stroke="#f2c230" stroke-width="2"/><path d="M372 153L380 158L372 163" fill="none" stroke="#f2c230" stroke-width="2"/><path d="M282 266H374" stroke="#8f908a" stroke-width="2"/><path d="M372 261L380 266L372 271" fill="none" stroke="#8f908a" stroke-width="2"/><rect x="380" y="110" width="340" height="196" fill="#121416" stroke="#2a2d31"/><text x="392" y="136" font-size="15" font-weight="700" letter-spacing="1.5">GOVERNOR</text><text x="392" y="156" font-size="12" fill="#8f908a">Player input outranks all</text><text x="392" y="294" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#7fb48a">TESTED</text><text x="392" y="186" font-size="12.5" fill="#d9d6cc">· Player input: full takeover, or claims</text><text x="392" y="206" font-size="12.5" fill="#d9d6cc">· Companion yields 1.5 s after any input</text><text x="392" y="226" font-size="12.5" fill="#d9d6cc">· Partial claims last 250 ms unrefreshed</text><text x="392" y="246" font-size="12.5" fill="#d9d6cc">· Companion needs a grant from the Legend</text><text x="392" y="266" font-size="12.5" fill="#d9d6cc">· Pause key / STOP file: latched halt</text><path d="M722 208H814" stroke="#f2c230" stroke-width="2"/><path d="M812 203L820 208L812 213" fill="none" stroke="#f2c230" stroke-width="2"/><rect x="820" y="150" width="240" height="100" fill="#121416" stroke="#2a2d31"/><text x="832" y="176" font-size="15" font-weight="700" letter-spacing="1.5">OUTPUT</text><text x="832" y="196" font-size="12" fill="#8f908a">Virtual pad to the game</text><text x="832" y="238" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#7fb48a">PAD + KILL SWITCH VERIFIED</text><text x="40" y="340" font-size="12" fill="#8f908a">Voice: “you drive” grants, “my turn” revokes, “stop” halts. Negation is handled, so “don’t stop” does not halt.</text></g></svg>
