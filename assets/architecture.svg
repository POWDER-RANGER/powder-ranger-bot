<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Every input travels as a signed packet to the Governor, the only process that owns the virtual controller"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2c230"/></marker></defs><rect width="1000" height="440" fill="#150809"/><g stroke="#4a2a30" stroke-width="1" opacity=".45"><path d="M40 0V440"/><path d="M80 0V440"/><path d="M120 0V440"/><path d="M160 0V440"/><path d="M200 0V440"/><path d="M240 0V440"/><path d="M280 0V440"/><path d="M320 0V440"/><path d="M360 0V440"/><path d="M400 0V440"/><path d="M440 0V440"/><path d="M480 0V440"/><path d="M520 0V440"/><path d="M560 0V440"/><path d="M600 0V440"/><path d="M640 0V440"/><path d="M680 0V440"/><path d="M720 0V440"/><path d="M760 0V440"/><path d="M800 0V440"/><path d="M840 0V440"/><path d="M880 0V440"/><path d="M920 0V440"/><path d="M960 0V440"/><path d="M0 40H1000"/><path d="M0 80H1000"/><path d="M0 120H1000"/><path d="M0 160H1000"/><path d="M0 200H1000"/><path d="M0 240H1000"/><path d="M0 280H1000"/><path d="M0 320H1000"/><path d="M0 360H1000"/><path d="M0 400H1000"/></g><rect x="30" y="60" width="260" height="80" fill="#2a1317" stroke="#4a2a30" stroke-width="1"/><text x="44" y="86" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#d9d6cc">LAUNCHER</text><text x="44" y="106" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">grant · revoke · halt</text><text x="44" y="122" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">owns the session key</text><rect x="30" y="160" width="260" height="80" fill="#2a1317" stroke="#f2c230" stroke-width="1.6"/><text x="44" y="186" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#f2c230">PLAYER INPUT</text><text x="44" y="206" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">pad · keys/switch · voice · gaze</text><text x="44" y="222" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">always outranks the companion</text><rect x="30" y="260" width="260" height="80" fill="#2a1317" stroke="#4a2a30" stroke-width="1"/><text x="44" y="286" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#d9d6cc">REFLEX RUNNER</text><text x="44" y="306" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">capture → NitroGen client</text><text x="44" y="322" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">server: separate process, GPU</text><rect x="350" y="40" width="340" height="340" fill="#2a1317" stroke="#f2c230" stroke-width="1.6"/><text x="366" y="66" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#f2c230">GOVERNOR  ·  SINGLE PATH TO THE PAD</text><rect x="366" y="84" width="308" height="50" fill="#150809" stroke="#4a2a30"/><text x="380" y="105" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d9d6cc">1  VERIFY</text><text x="380" y="123" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#8a8b86">HMAC · strict parse · reject malformed</text><rect x="366" y="142" width="308" height="50" fill="#150809" stroke="#4a2a30"/><text x="380" y="163" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d9d6cc">2  POLICY</text><text x="380" y="181" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#8a8b86">halt, stale, replay, scope, focus, rate</text><rect x="366" y="200" width="308" height="50" fill="#150809" stroke="#4a2a30"/><text x="380" y="221" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d9d6cc">3  LOG</text><text x="380" y="239" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#8a8b86">hash-chained · sealed with a local key</text><rect x="366" y="258" width="308" height="50" fill="#150809" stroke="#4a2a30"/><text x="380" y="279" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d9d6cc">4  MOTOR MODEL</text><text x="380" y="297" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#8a8b86">onset · travel · tremor · button timing</text><rect x="366" y="316" width="308" height="50" fill="#150809" stroke="#4a2a30"/><text x="380" y="337" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#d9d6cc">5  WATCHDOG</text><text x="380" y="355" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#8a8b86">halt latches before neutral is written</text><rect x="740" y="130" width="240" height="80" fill="#2a1317" stroke="#4a2a30" stroke-width="1"/><text x="754" y="156" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#d9d6cc">VIRTUAL PAD</text><text x="754" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">X360 / DS4 via ViGEmBus</text><text x="754" y="192" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">the game sees a controller</text><rect x="740" y="270" width="240" height="80" fill="#2a1317" stroke="#4a2a30" stroke-width="1"/><text x="754" y="296" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#d9d6cc">GAME</text><text x="754" y="316" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">window in front</text><text x="754" y="332" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#8a8b86">no memory access or injection</text><path d="M290 100H350" stroke="#f2c230" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M290 200H350" stroke="#f2c230" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M290 300H350" stroke="#f2c230" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M690 170H740" stroke="#f2c230" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M860 210V270" stroke="#f2c230" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><path d="M860 350V410H160V340" stroke="#f2c230" stroke-width="1.5" fill="none" marker-end="url(#ah)" stroke-dasharray="5 5"/><text x="510" y="402" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1" fill="#8a8b86">screen pixels only</text><text x="30" y="30" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="3" fill="#8a8b86">OPERATING PICTURE  ·  every arrow into the Governor is a signed packet over localhost</text></svg>