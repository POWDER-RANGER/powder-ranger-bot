<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" role="img" aria-label="ÆTHER · how it learns">
<title>ÆTHER · how it learns</title>
<rect width="1100" height="430" fill="#150809"/>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#d9d6cc">
<rect x="40" y="34" width="8" height="8" fill="#f2c230"/>
<text x="56" y="43" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#b3a6a0">ÆTHER · HOW IT LEARNS</text>
<text x="40" y="78" font-size="26" font-weight="700">Prep online. Play offline.</text>
<text x="40" y="106" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#7fb48a">PREP MODE · NETWORK OPEN</text><rect x="40" y="116" width="230" height="86" fill="#2a1317" stroke="#8aa4d6" stroke-dasharray="5 4"/><text x="52" y="142" font-size="15" font-weight="700" letter-spacing="1.5">SOURCES</text><text x="52" y="162" font-size="12" fill="#b3a6a0">Guides, wikis, videos, tips</text><text x="52" y="190" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#8aa4d6">DESIGN ONLY</text><path d="M272 159H282" stroke="#f2c230" stroke-width="2"/><path d="M280 154L288 159L280 164" fill="none" stroke="#f2c230" stroke-width="2"/><rect x="288" y="116" width="230" height="86" fill="#2a1317" stroke="#8aa4d6" stroke-dasharray="5 4"/><text x="300" y="142" font-size="15" font-weight="700" letter-spacing="1.5">QUARANTINE</text><text x="300" y="162" font-size="12" fill="#b3a6a0">Stored as data, never run</text><text x="300" y="190" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#8aa4d6">DESIGN ONLY</text><path d="M520 159H530" stroke="#f2c230" stroke-width="2"/><path d="M528 154L536 159L528 164" fill="none" stroke="#f2c230" stroke-width="2"/><rect x="536" y="116" width="230" height="86" fill="#2a1317" stroke="#8aa4d6" stroke-dasharray="5 4"/><text x="548" y="142" font-size="15" font-weight="700" letter-spacing="1.5">DISTILL</text><text x="548" y="162" font-size="12" fill="#b3a6a0">Notes, plans, tips with source links</text><text x="548" y="190" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#8aa4d6">DESIGN ONLY</text><path d="M768 159H778" stroke="#f2c230" stroke-width="2"/><path d="M776 154L784 159L776 164" fill="none" stroke="#f2c230" stroke-width="2"/><rect x="784" y="116" width="230" height="86" fill="#2a1317" stroke="#8aa4d6" stroke-dasharray="5 4"/><text x="796" y="142" font-size="15" font-weight="700" letter-spacing="1.5">LEGEND REVIEWS</text><text x="796" y="162" font-size="12" fill="#b3a6a0">Only approved items go in</text><text x="796" y="190" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#8aa4d6">DESIGN ONLY</text><path d="M899 202V250" fill="none" stroke="#f2c230" stroke-width="2"/><rect x="740" y="250" width="320" height="76" fill="#2a1317" stroke="#4a2a30"/><text x="752" y="276" font-size="15" font-weight="700" letter-spacing="1.5">GAME PACK</text><text x="752" y="296" font-size="12" fill="#b3a6a0">Versioned, hashed, read-only in play</text><text x="752" y="314" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#f2c230">PACKS BUILT · NOTES PROPOSED</text><line x1="40" y1="352" x2="1060" y2="352" stroke="#d1573f" stroke-dasharray="6 5"/><text x="40" y="372" font-family="Menlo,Consolas,monospace" font-size="11" letter-spacing="2" fill="#d1573f">PLAY MODE · NETWORK CLOSED · LOCKDOWN BUILT, NOT YET RUN</text><rect x="40" y="250" width="300" height="76" fill="#2a1317" stroke="#f2c230"/><text x="52" y="276" font-size="15" font-weight="700" letter-spacing="1.5">LEARNING FROM THE LEGEND</text><text x="52" y="296" font-size="12" fill="#b3a6a0">Record, fit motor profile, reaction test</text><text x="52" y="314" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#7fb48a">BUILT, TESTED</text><rect x="360" y="250" width="360" height="76" fill="#2a1317" stroke="#8aa4d6" stroke-dasharray="5 4"/><text x="372" y="276" font-size="15" font-weight="700" letter-spacing="1.5">GHOST LAPS, TIP RE-EMPHASIS</text><text x="372" y="296" font-size="12" fill="#b3a6a0">Learn from repeated runs; repeat game tips</text><text x="372" y="314" font-family="Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#8aa4d6">DESIGN ONLY</text><text x="40" y="410" font-size="12" fill="#b3a6a0">Nothing here changes the controller path: notes become intents, and every intent still goes through the Governor.</text></g></svg>
