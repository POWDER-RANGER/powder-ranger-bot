name: Bug report
description: Something behaves differently than documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened and what you expected}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
  - type: input
    id: env
    attributes: {label: Environment, placeholder: "OS, Python version, commit"}
